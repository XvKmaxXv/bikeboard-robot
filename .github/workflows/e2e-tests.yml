name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Escolhe um navegador de sua preferencia'
        required: true
        default: 'chromium'
      base_url:
        description: 'Escolha o ambiente de testes'
        required: true
        default: 'http://localhost:3000'
  
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    
    - name: install WebApp dependencies
      run: npm install

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Browser Lib Init
      run: rfbrowser init --with-deps
  
    - name: Run WebApp
      run: npm start &
      env:
        CI: true

    - name: Wait for WebApp
      run: npx wait-on BASE_URL:${{ github.event.inputs.base_url}} --timeout=60000

    - name: Run E2E Tests
      run: robot -d ./logs -v BROWSER:${{ github.event.inputs.browser}} -v BASE_URL:${{ github.event.inputs.base_url}} robot/tests

    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-results-${{ github.event.inputs.browser}}
        path: logs/
